<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComfyUI Chat — Sign In</title>
<meta name="theme-color" content="#16171b">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-body);
    background:
      radial-gradient(ellipse at center, rgba(22,23,27,0.35) 0%, rgba(22,23,27,0.85) 75%),
      url("{{ url_for('static', filename='img/login-hero.webp') }}") center / cover no-repeat fixed,
      var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }

  /* Chamfered card: the outer element is the neon border, the inner the fill. */
  .card {
    position: relative; z-index: 2;
    width: 100%;
    max-width: 380px;
    padding: 1px;
    background: var(--neon-rule);
    clip-path: var(--chamfer);
  }
  /* clip-path runs after filter, so the glow lives on a wrapper. */
  .card-glow {
    position: relative; z-index: 2;
    width: 100%; max-width: 380px;
    filter: drop-shadow(0 0 18px rgba(0,240,255,0.25)) drop-shadow(0 0 32px rgba(255,43,214,0.15));
  }
  .card-inner {
    background: rgba(26,28,33,0.92);
    backdrop-filter: blur(8px);
    clip-path: var(--chamfer);
    padding: 2.5rem 2rem;
  }

  .brand {
    text-align: center;
    margin-bottom: 2rem;
  }

  .brand-icon {
    width: 64px; height: 64px;
    margin: 0 auto 0.8rem;
    display: block;
    border-radius: 14px;
  }

  .brand h1 {
    font-family: var(--font-display);
    color: var(--neon);
    font-size: 1.7rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-shadow: var(--text-glow);
  }

  .brand p {
    color: var(--g-600);
    font-family: var(--font-display);
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-size: 0.85rem;
    margin-top: 0.3rem;
  }

  .error {
    background: rgba(255, 56, 96, 0.1);
    border: 1px solid rgba(255, 56, 96, 0.45);
    color: var(--danger);
    border-radius: 6px;
    padding: 0.65rem 0.9rem;
    font-size: 0.85rem;
    margin-bottom: 1.25rem;
  }

  .field { margin-bottom: 1rem; }

  label {
    display: block;
    color: var(--g-400);
    font-family: var(--font-display);
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 0.4rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  input {
    width: 100%;
    background: var(--g-950);
    border: 1px solid var(--g-800);
    border-radius: 6px;
    color: var(--g-200);
    font-size: 0.95rem;
    padding: 0.65rem 0.9rem;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    font-family: inherit;
  }

  input:focus { border-color: var(--neon); box-shadow: var(--glow); }
  input::placeholder { color: var(--g-700); }

  button {
    width: 100%;
    margin-top: 1.5rem;
    background: var(--neon);
    color: var(--g-950);
    border: none;
    clip-path: var(--chamfer-sm);
    padding: 0.75rem;
    font-family: var(--font-display);
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  button:hover { background: var(--neon-2); color: #fff; }
</style>
</head>
<body>
<div class="card-glow"><div class="card"><div class="card-inner">
  <div class="brand">
    <img class="brand-icon" src="{{ url_for('static', filename='img/apple-touch-icon.png') }}" alt="">
    <h1>ComfyUI Chat</h1>
    <p>Sign in to continue</p>
  </div>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST" autocomplete="off">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autofocus
             autocomplete="off" placeholder="Enter username">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required
             autocomplete="off" placeholder="Enter password">
    </div>
    <button type="submit">Sign In</button>
  </form>
</div></div></div>
</body>
</html>
